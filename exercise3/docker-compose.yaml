version: '3.0'

services:
    my-app:
      image: shira8808/exe3:1.0
      build: .
      ports:
        - 3000:3000
      restart: always
      environment:
        MONGO_SERVER : mongodb
        MONGO_USER : root
        MONGO_PASSWORD : password
        MONGO_PORT : 27017
    mongodb:
      restart: always
      image: mongo
      environment:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: password
      ports:
      - 27017:27017
      volumes:
      - mongo-data:/data/db
    mongo-express:
      restart: always
      depends_on:
        - mongodb
      image: mongo-express
      ports:
        - 8081:8081
      environment:
        ME_CONFIG_MONGODB_SERVER: mongodb
        ME_CONFIG_BASICAUTH_USERNAME: user
        ME_CONFIG_BASICAUTH_PASSWORD: 1234
        ME_CONFIG_MONGODB_ADMINPASSWORD: password
        ME_CONFIG_MONGODB_ADMINUSERNAME: root
volumes:
  mongo-data:
    driver: local


      